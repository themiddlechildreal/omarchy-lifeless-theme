# red     = "#d9836f"
# green   = "#96b8a4"
# yellow  = "#ecc98c"
# blue    = "#8ba5c4"
# magenta = "#c29ebd"
# cyan    = "#85b7c0"
# white   = "#f5f1e8"

# ── Extended ─────────────────────────────────────────────────
[[colors.indexed_colors]]
index = 16
color = "#e0916a"   # muted coral accent at index 16

[[colors.indexed_colors]]
index = 17
color = "#8a6a52"   # umber brown at index 17

