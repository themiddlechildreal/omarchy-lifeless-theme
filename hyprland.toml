schema = 1

[general]
gaps_in = 2
gaps_out = 4
border_size = 3

[general.col]
active_border = "#7EC2B2 #294842 45deg"
inactive_border = "#306953"

[general.group.col]
border_active = "#7EC2B2 #294842 45deg"
border_inactive = "#306953"

[decoration]
rounding = 6
rounding_power = 2
inactive_opacity = 0.94

[decoration.blur]
enabled = true
size = 6
passes = 2

[decoration.shadow]
enabled = true
range          = 4    #subtle shadow: doesn't dominate the light palette
render_power   = 3
color          = "rgba(1a1f2bb5)"
color_inactive = "rgba(12151ed8)"
offset = "0 4"